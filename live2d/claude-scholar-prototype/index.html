<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Scholar Live2D Prototype</title>
  <style>
    :root {
      --orange: #df8155;
      --orange-dark: #a95535;
      --cream: #fff6ec;
      --paper: #f8eadb;
      --line: #8f5f4a;
      --shadow: rgba(97, 48, 24, 0.25);
      --glow: rgba(255, 178, 105, 0.72);
      --eye-open: 1;
      --smile: 0;
      --blush: 0;
      --spark: 0;
      --tear: 0;
      --glasses: 0;
      --glitch: 0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 320px;
      gap: 0;
      background:
        radial-gradient(circle at 72% 15%, rgba(238, 150, 101, 0.22), transparent 28%),
        linear-gradient(135deg, #fffaf5, #f4dfcd 52%, #ffe9dc);
      color: #5d3b2d;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      overflow-x: hidden;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px;
      overflow: hidden;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(169, 85, 53, 0.18);
      border-radius: 50%;
      pointer-events: none;
    }
    .stage::before { width: 520px; height: 520px; right: 8%; top: 5%; }
    .stage::after { width: 380px; height: 380px; left: 8%; bottom: 10%; }

    .model-shell {
      width: min(72vw, 740px);
      max-height: 96vh;
      aspect-ratio: 3 / 4;
      position: relative;
      filter: drop-shadow(0 28px 36px rgba(113, 58, 31, 0.26));
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      user-select: none;
    }

    .layer { transform-box: fill-box; transform-origin: center; }
    .breath { animation: breath 4.2s ease-in-out infinite; }
    .hair-front { animation: hairFront 3.2s ease-in-out infinite; }
    .hair-side-l { animation: hairSideL 4.6s ease-in-out infinite; }
    .hair-side-r { animation: hairSideR 4.8s ease-in-out infinite; }
    .hair-back { animation: hairBack 5.8s ease-in-out infinite; }
    .cape-l { animation: capeL 5.4s ease-in-out infinite; }
    .cape-r { animation: capeR 5.7s ease-in-out infinite; }
    .ribbon { animation: ribbon 2.8s ease-in-out infinite; }
    .watch { animation: watch 3.8s ease-in-out infinite; }
    .paper { animation: floatPaper 8s ease-in-out infinite; opacity: 0.72; }
    .sparkle { opacity: var(--spark); animation: sparkle 1.6s ease-in-out infinite; }
    .tear { opacity: var(--tear); animation: tearDrop 2.4s ease-in-out infinite; }
    .glitch { opacity: var(--glitch); mix-blend-mode: multiply; animation: glitch 0.2s steps(2) infinite; }
    .glasses-flash { opacity: var(--glasses); animation: flash 1.4s ease-in-out infinite; }
    .blush { opacity: var(--blush); }
    .eye-open { transform: scaleY(var(--eye-open)); transform-box: fill-box; transform-origin: center; transition: transform .18s ease; }
    .mouth-smile { opacity: calc(1 - var(--smile)); }
    .mouth-happy { opacity: var(--smile); }

    .model-shell[data-motion="wave"] .arm-wave { animation: wave 0.9s ease-in-out 3; transform-origin: 77% 42%; }
    .model-shell[data-motion="bow"] .body-all { animation: bow 1.8s ease-in-out 1; transform-origin: 50% 72%; }
    .model-shell[data-motion="tilt"] .head-all { animation: tilt 1.8s ease-in-out 1; transform-origin: 50% 35%; }
    .model-shell[data-motion="book"] .book { animation: bookFlip 1.4s ease-in-out 1; transform-origin: 48% 53%; }

    @keyframes breath { 0%,100%{ transform: translateY(0) scaleY(1);} 50%{ transform: translateY(-5px) scaleY(1.012);} }
    @keyframes hairFront { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(1.4deg) translateX(2px);} }
    @keyframes hairSideL { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(-3deg) translateX(-4px);} }
    @keyframes hairSideR { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(3deg) translateX(4px);} }
    @keyframes hairBack { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(1.8deg) translateY(5px);} }
    @keyframes capeL { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(-2.6deg) translateX(-8px);} }
    @keyframes capeR { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(2.4deg) translateX(8px);} }
    @keyframes ribbon { 0%,100%{ transform: rotate(0);} 50%{ transform: rotate(3deg);} }
    @keyframes watch { 0%,100%{ transform: rotate(-4deg);} 50%{ transform: rotate(6deg);} }
    @keyframes floatPaper { 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-26px) rotate(10deg);} }
    @keyframes sparkle { 0%,100%{ transform: scale(.8); opacity: calc(var(--spark) * .4);} 50%{ transform: scale(1.2); opacity: var(--spark);} }
    @keyframes tearDrop { 0%{ transform: translateY(-8px); } 100%{ transform: translateY(24px); } }
    @keyframes glitch { 0%{ transform: translateX(-2px);} 100%{ transform: translateX(2px);} }
    @keyframes flash { 0%,100%{ opacity: calc(var(--glasses) * .25);} 50%{ opacity: var(--glasses);} }
    @keyframes wave { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(-16deg);} }
    @keyframes bow { 0%,100%{ transform: rotate(0deg) translateY(0);} 45%{ transform: rotate(5deg) translateY(26px);} }
    @keyframes tilt { 0%,100%{ transform: rotate(0deg);} 50%{ transform: rotate(-10deg);} }
    @keyframes bookFlip { 0%,100%{ transform: rotateY(0deg);} 50%{ transform: rotateY(28deg) rotate(-2deg);} }

    .panel {
      min-height: 100vh;
      padding: 28px 24px;
      background: rgba(255, 248, 241, 0.82);
      border-left: 1px solid rgba(169, 85, 53, 0.18);
      backdrop-filter: blur(16px);
      box-shadow: -20px 0 50px rgba(115, 58, 29, 0.12);
    }
    .panel h1 { margin: 0 0 8px; font-size: 23px; color: #a95535; }
    .panel p { margin: 0 0 18px; line-height: 1.65; font-size: 13px; }
    .group { margin: 22px 0; }
    .group h2 { font-size: 14px; color: #7f4a34; letter-spacing: .08em; text-transform: uppercase; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      appearance: none;
      border: 1px solid rgba(169, 85, 53, 0.28);
      border-radius: 999px;
      padding: 10px 12px;
      color: #733f2b;
      background: linear-gradient(180deg, #fffaf5, #f7dcc7);
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(169, 85, 53, 0.12);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 20px rgba(169, 85, 53, 0.18); }
    .note {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(223, 129, 85, 0.12);
      border: 1px solid rgba(223, 129, 85, 0.22);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 880px) {
      body { grid-template-columns: 1fr; }
      .panel { min-height: auto; border-left: 0; border-top: 1px solid rgba(169, 85, 53, 0.18); }
      .model-shell { width: min(96vw, 660px); }
    }
  </style>
</head>

  <aside class="panel">
    <h1>Claude Scholar Live2D 原型</h1>
    <p>这是基于参考图制作的浏览器可运行分层 Live2D 风格原型：具备头发/披肩/怀表物理摆动、表情切换、动作触发、眼镜反光与 AI 故障特效。</p>

    <section class="group">
      <h2>表情</h2>
      <div class="buttons">
        <button data-exp="default">默认</button>
        <button data-exp="smile">开心</button>
        <button data-exp="shy">害羞</button>
        <button data-exp="cry">委屈</button>
        <button data-exp="serious">推理</button>
        <button data-exp="glitch">AI 故障</button>
      </div>
    </section>

    <section class="group">
      <h2>动作</h2>
      <div class="buttons">
        <button data-motion="wave">挥手</button>
        <button data-motion="bow">鞠躬</button>
        <button data-motion="tilt">歪头</button>
        <button data-motion="book">翻书</button>
      </div>
    </section>

    <section class="group note">
      <strong>说明：</strong>这不是 Cubism Editor 生成的官方 `.cmo3` 二进制工程，而是可运行、可预览、可继续移植到 Cubism 的分层前端原型。下一步可把这些层级映射到 PSD 与 Cubism 参数。
    </section>
  </aside>

  <script>
    const model = document.querySelector('#model');
    const expressions = {
      default: { eye: 1, smile: 0, blush: 0, spark: 0, tear: 0, glasses: 0, glitch: 0 },
      smile: { eye: 0.72, smile: 1, blush: 0.18, spark: 1, tear: 0, glasses: 0, glitch: 0 },
      shy: { eye: 0.78, smile: 0.35, blush: 1, spark: 0.2, tear: 0, glasses: 0, glitch: 0 },
      cry: { eye: 0.58, smile: 0, blush: 0.2, spark: 0, tear: 1, glasses: 0, glitch: 0 },
      serious: { eye: 1.08, smile: 0, blush: 0, spark: 0.35, tear: 0, glasses: 1, glitch: 0 },
      glitch: { eye: 1.18, smile: 0.2, blush: 0, spark: 1, tear: 0, glasses: 1, glitch: 1 },
    };

    function setExpression(name) {
      const exp = expressions[name] || expressions.default;
      model.dataset.expression = name;
      model.style.setProperty('--eye-open', exp.eye);
      model.style.setProperty('--smile', exp.smile);
      model.style.setProperty('--blush', exp.blush);
      model.style.setProperty('--spark', exp.spark);
      model.style.setProperty('--tear', exp.tear);
      model.style.setProperty('--glasses', exp.glasses);
      model.style.setProperty('--glitch', exp.glitch);
    }

    function playMotion(name) {
      model.dataset.motion = 'idle';
      requestAnimationFrame(() => {
        model.dataset.motion = name;
        window.setTimeout(() => { model.dataset.motion = 'idle'; }, 1900);
      });
    }

    document.querySelectorAll('[data-exp]').forEach((btn) => {
      btn.addEventListener('click', () => setExpression(btn.dataset.exp));
    });
    document.querySelectorAll('[data-motion]').forEach((btn) => {
      btn.addEventListener('click', () => playMotion(btn.dataset.motion));
    });

    setExpression('default');
  </script>
</body>
